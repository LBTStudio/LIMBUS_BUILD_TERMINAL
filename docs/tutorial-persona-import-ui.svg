<rect x="151" y="64" width="913" height="386" rx="8" fill="#151513" stroke="#39332a"/>
<text x="174" y="89" font-family="sans-serif" font-size="11" letter-spacing="1.4" fill="#918775">BUILD WORKSPACE</text>
<text x="174" y="113" font-family="sans-serif" font-size="20" font-weight="700" fill="#eee5d5">ビルド</text>
<text x="248" y="112" font-family="sans-serif" font-size="12" fill="#a9a091">人格・スキル・パッシブ・強化・サポート・E.G.O・精神・アイテム</text>
<rect x="170" y="128" width="876" height="39" rx="6" fill="#201f1c" stroke="#35312a"/>
<g font-family="sans-serif" font-size="14" fill="#bdb5a6">
<text x="191" y="152" fill="#ffe4a4" font-weight="700">人格</text><text x="258" y="152">スキル</text><text x="323" y="152">パッシブ</text><text x="416" y="152">強化</text><text x="475" y="152">サポート</text><text x="566" y="152">E.G.O</text><text x="635" y="152">精神</text><text x="690" y="152">アイテム</text>
</g>
<rect x="178" y="136" width="52" height="24" rx="4" fill="none" stroke="#e4bd68" stroke-width="1.5"/>
<circle cx="240" cy="139" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="240" y="144" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">2</text>
<rect x="170" y="180" width="452" height="252" rx="6" fill="#191816" stroke="#39332a"/>
<text x="188" y="202" font-family="sans-serif" font-size="14" font-weight="700" fill="#e9dfcd">人格一覧</text>
<text x="188" y="221" font-family="sans-serif" font-size="11" fill="#9e9687">人格未装備でも作成・流し込みできます</text>
<rect x="188" y="233" width="155" height="31" rx="4" fill="#26231d" stroke="#61553d"/><text x="198" y="253" font-family="sans-serif" font-size="12" fill="#d9cfbc">＋ カスタム人格</text>
<rect x="351" y="229" width="250" height="39" rx="5" fill="#4c391f" stroke="#ffb45f" stroke-width="2.5"/>
<text x="367" y="253" font-family="sans-serif" font-size="15" font-weight="800" fill="#ffe2a0">テキスト流し込み反映</text>
<rect x="183" y="279" width="426" height="39" rx="4" fill="#211f1a" stroke="#35312a"/><text x="198" y="303" font-family="sans-serif" font-size="13" fill="#c9bfad">人格名・キーワードなどで検索</text>
<rect x="183" y="325" width="426" height="38" rx="4" fill="#201e1a"/><text x="198" y="349" font-family="sans-serif" font-size="13" fill="#c6bdad">人格カード一覧</text>
<rect x="183" y="370" width="426" height="44" rx="4" fill="#201e1a"/><text x="198" y="396" font-family="sans-serif" font-size="13" fill="#9b9282">候補を選ぶ（取り込み前でも使えます）</text>
<circle cx="599" cy="224" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="599" y="229" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">3</text>
<path d="M654 220 C680 220 682 248 652 248 L605 248" fill="none" stroke="#ffb45f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="637" y="180" width="409" height="252" rx="6" fill="#191816" stroke="#39332a"/>
<text x="657" y="204" font-family="sans-serif" font-size="14" font-weight="700" fill="#e9dfcd">人格の詳細</text>
<text x="657" y="235" font-family="sans-serif" font-size="13" fill="#c8bead">人格を選択 または テキスト流し込み反映</text>
<text x="657" y="258" font-family="sans-serif" font-size="12" fill="#958d7f">人格未選択時は、ここにも同名ボタンが表示されます。</text>
<rect x="657" y="272" width="262" height="34" rx="5" fill="#28251f" stroke="#7b6740"/>
<text x="671" y="294" font-family="sans-serif" font-size="13" fill="#e6d5ad">テキスト流し込み反映（同じ入口）</text>
<path d="M520 268 C538 300 603 307 650 291" fill="none" stroke="#ffb45f" stroke-width="1.6" stroke-dasharray="4 4"/>
<text x="22" y="490" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffcc7a">① ビルド → ② 人格 → ③ 人格一覧上部の「テキスト流し込み反映」</text>
<text x="22" y="519" font-family="sans-serif" font-size="14" fill="#c7bcaa">迷ったら、まず「人格」タブを開いてください。人格の装備前でも取り込めます。</text>
<text x="22" y="543" font-family="sans-serif" font-size="12" fill="#8f887a">画面構成を現行UIのボタン名に合わせて再構成した位置案内図（キャプチャ画像ではありません）。</text>
</svg>