<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 570" role="img" aria-labelledby="title desc">
<title id="title">人格データのテキスト流し込みボタンの場所</title>
<desc id="desc">実画面の名称に合わせた配置図。ビルドを開き、人格タブを選び、人格一覧の上部にあるテキスト流し込み反映ボタンを押す。人格未選択時は詳細欄にも同名ボタンがある。</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ffb45f"/></marker></defs>
<rect width="1080" height="570" rx="16" fill="#101010" stroke="#544a39"/>
<rect x="1" y="1" width="1078" height="48" rx="15" fill="#191816"/>
<path d="M1 48 H1079" stroke="#544a39"/>
<text x="22" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#e8d7ac">◈ LIMBUS BUILD TERMINAL</text>
<rect x="812" y="11" width="245" height="28" rx="5" fill="#26231e" stroke="#62543a"/>
<text x="827" y="30" font-family="sans-serif" font-size="13" fill="#d8cdb8">アカウント：現在のキャラクター</text>
