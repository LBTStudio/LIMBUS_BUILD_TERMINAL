<rect x="23" y="143" width="108" height="39" rx="5" fill="#43341d" stroke="#e4bd68" stroke-width="1.5"/><text x="41" y="167" fill="#ffe4a4" font-weight="700">ビルド</text>
<rect x="23" y="189" width="108" height="37" rx="5" fill="#211f1a"/><text x="41" y="212">ショップ</text>
<rect x="23" y="233" width="108" height="37" rx="5" fill="#211f1a"/><text x="41" y="256">記録</text>
<rect x="23" y="277" width="108" height="37" rx="5" fill="#211f1a"/><text x="41" y="300">設定</text>
<rect x="23" y="321" width="108" height="37" rx="5" fill="#211f1a"/><text x="41" y="344">使い方</text>
</g>
