<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">保存、バックアップ、所持ライブラリ、共有の違い</title>
<desc id="desc">端末内自動保存、作業状態JSON、所持ライブラリJSON、共有シートとCCFOLIA JSONの違い。</desc>
<rect width="1200" height="700" rx="22" fill="#11100f"/>
<text x="48" y="52" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#e5c879">保存・共有・出力は目的で使い分ける</text>
<g font-family="Noto Sans JP, Yu Gothic, sans-serif">
<g><rect x="44" y="82" width="542" height="220" rx="14" fill="#1b1916" stroke="#67583d" stroke-width="2"/><text x="72" y="122" font-size="18" fill="#e5c879" font-weight="700">01｜自動保存</text><text x="72" y="164" font-size="25" fill="#f6f0e6" font-weight="700">この端末で作業を続ける</text><text x="72" y="204" font-size="19" fill="#d8cfc0">通常の編集はブラウザー内へ自動保存。</text><text x="72" y="237" font-size="19" fill="#d8cfc0">同じ端末・同じブラウザーが前提。</text><text x="72" y="271" font-size="17" fill="#e5c879">別端末への同期ではありません。</text></g>
<g><rect x="614" y="82" width="542" height="220" rx="14" fill="#242016" stroke="#d7b76b" stroke-width="2"/><text x="642" y="122" font-size="18" fill="#e5c879" font-weight="700">02｜現在の作業状態を保存</text><text x="642" y="164" font-size="25" fill="#f6f0e6" font-weight="700">広い作業状態のJSON</text><text x="642" y="204" font-size="19" fill="#d8cfc0">所持・設定・リザルト・収支などを含む。</text><text x="642" y="237" font-size="19" fill="#d8cfc0">読み込み時は、適用するカテゴリを確認。</text><text x="642" y="271" font-size="17" fill="#e5c879">選択したカテゴリは現在の状態を上書き。</text></g>
<g><rect x="44" y="328" width="542" height="220" rx="14" fill="#182022" stroke="#648a94" stroke-width="2"/><text x="72" y="368" font-size="18" fill="#b6e1e8" font-weight="700">03｜所持ライブラリを保存</text><text x="72" y="410" font-size="25" fill="#f6f0e6" font-weight="700">所持データの引き継ぎ</text><text x="72" y="450" font-size="19" fill="#d4e4e7">所持人格・E.G.O・保存済みビルド。</text><text x="72" y="483" font-size="19" fill="#d4e4e7">お気に入り・最近の履歴も含む。</text><text x="72" y="517" font-size="17" fill="#b6e1e8">作業状態ファイルとは別のJSONです。</text></g>
<g><rect x="614" y="328" width="542" height="220" rx="14" fill="#1d1c24" stroke="#8f81b8" stroke-width="2"/><text x="642" y="368" font-size="18" fill="#d6cbff" font-weight="700">04｜共有シート／CCFOLIA JSON</text><text x="642" y="410" font-size="25" fill="#f6f0e6" font-weight="700">人に見せる／卓で使う</text><text x="642" y="450" font-size="19" fill="#ddd7ec">共有シートは読みやすいHTMLの共有用。</text><text x="642" y="483" font-size="19" fill="#ddd7ec">CCFOLIA JSONは出力先向けデータ。</text><text x="642" y="517" font-size="17" fill="#d6cbff">どちらも完全バックアップの代用ではない。</text></g>
<rect x="44" y="578" width="1112" height="74" rx="12" fill="#322c1e" stroke="#d7b76b"/><text x="70" y="609" font-size="20" font-weight="700" fill="#f0d58b">読み込み前の確認</text><text x="70" y="635" font-size="18" fill="#f5ede0">ファイルの内容・適用範囲を確認。残したいカテゴリはチェックを外し、必要ならCtrl+Zで戻す。</text>
</g></svg>