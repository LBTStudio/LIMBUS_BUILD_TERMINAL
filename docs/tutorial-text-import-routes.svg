<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">文章・共有URLの取り込み口の違い</title>
<desc id="desc">人格データ、リザルトと購入履歴、硝子窓のキャラクター全体という3つの別々の取り込み経路を示す。</desc>
<rect width="1200" height="700" rx="22" fill="#11100f"/>
<text x="48" y="52" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#e5c879">取り込み口は3種類。入れたいデータで選ぶ</text>
<g font-family="Noto Sans JP, Yu Gothic, sans-serif">
<g><rect x="36" y="82" width="360" height="500" rx="16" fill="#201b14" stroke="#d7b76b" stroke-width="2"/><rect x="36" y="82" width="360" height="62" rx="16" fill="#3a2d15"/><text x="62" y="121" font-size="22" font-weight="700" fill="#f5e7b7">A｜人格データ</text><text x="62" y="182" font-size="20" font-weight="700" fill="#f7f1e7">入口</text><text x="62" y="214" font-size="18" fill="#e0d5c3">ビルド → 人格</text><text x="62" y="245" font-size="18" fill="#e0d5c3">「テキスト流し込み反映」</text><path d="M62 270 H368" stroke="#67583d"/><text x="62" y="307" font-size="20" font-weight="700" fill="#f7f1e7">進め方</text><text x="62" y="340" font-size="18" fill="#e0d5c3">1. 完成文／区分入力／人格URL</text><text x="62" y="374" font-size="18" fill="#e0d5c3">2. 「解析する」で検査</text><text x="62" y="408" font-size="18" fill="#e0d5c3">3. 結果・エラーを確認</text><text x="62" y="442" font-size="18" fill="#e0d5c3">4. 同期元か新規作成を選択</text><text x="62" y="476" font-size="18" fill="#e0d5c3">5. 反映ボタンで確定</text><rect x="58" y="510" width="316" height="48" rx="8" fill="#161411" stroke="#897143"/><text x="75" y="540" font-size="16" fill="#e5c879">既存の公式人格は直接変更しない</text></g>
<g><rect x="420" y="82" width="360" height="500" rx="16" fill="#181d20" stroke="#7a9eae" stroke-width="2"/><rect x="420" y="82" width="360" height="62" rx="16" fill="#233941"/><text x="446" y="121" font-size="22" font-weight="700" fill="#e0f2f8">B｜リザルト記録</text><text x="446" y="182" font-size="20" font-weight="700" fill="#f7f1e7">入口</text><text x="446" y="214" font-size="18" fill="#d4e2e7">記録 → リザルトを記録</text><text x="446" y="245" font-size="18" fill="#d4e2e7">「取り込む」→「テキスト流し込み」</text><path d="M446 270 H752" stroke="#455a61"/><text x="446" y="307" font-size="20" font-weight="700" fill="#f7f1e7">進め方</text><text x="446" y="340" font-size="18" fill="#d4e2e7">1. シナリオ・報酬・購入の文章</text><text x="446" y="374" font-size="18" fill="#d4e2e7">2. 読み取り結果を確認</text><text x="446" y="408" font-size="18" fill="#d4e2e7">3. 不要な支出候補を外す</text><text x="446" y="442" font-size="18" fill="#d4e2e7">4. 未解決行の理由を確認</text><text x="446" y="476" font-size="18" fill="#d4e2e7">5. 「取り込む」で記録を作成</text><rect x="442" y="510" width="316" height="48" rx="8" fill="#111719" stroke="#547987"/><text x="458" y="540" font-size="16" fill="#aad5e3">報酬・支出・履歴を扱う</text></g>
<g><rect x="804" y="82" width="360" height="500" rx="16" fill="#1b1c18" stroke="#8c9d6a" stroke-width="2"/><rect x="804" y="82" width="360" height="62" rx="16" fill="#303b25"/><text x="830" y="121" font-size="22" font-weight="700" fill="#e4f0cb">C｜キャラクター全体</text><text x="830" y="182" font-size="20" font-weight="700" fill="#f7f1e7">入口</text><text x="830" y="214" font-size="18" fill="#dce5d1">SINNER SELECT</text><text x="830" y="245" font-size="18" fill="#dce5d1">対象アカウントの編集</text><path d="M830 270 H1136" stroke="#52603f"/><text x="830" y="307" font-size="20" font-weight="700" fill="#f7f1e7">進め方</text><text x="830" y="340" font-size="18" fill="#dce5d1">1. 「共有URLから取り込む」</text><text x="830" y="374" font-size="18" fill="#dce5d1">2. URLを貼り付けて読み込む</text><text x="830" y="408" font-size="18" fill="#dce5d1">3. 項目・候補を確認</text><text x="830" y="442" font-size="18" fill="#dce5d1">4. 反映するものを選ぶ</text><text x="830" y="476" font-size="18" fill="#dce5d1">5. 確定して結果を確認</text><rect x="826" y="510" width="316" height="48" rx="8" fill="#131512" stroke="#637450"/><text x="842" y="540" font-size="16" fill="#c2dba1">所持・購入履歴など全体の移行</text></g>
<text x="48" y="628" font-size="19" font-weight="700" fill="#e5c879">所持人格リストだけを追加する場合</text><text x="48" y="661" font-size="18" fill="#d8cfc0">「記録」→「リザルトを記録」→「取り込む」→「所持人格リストを取り込む」へ。上の3経路とは別です。</text>
</g></svg>