<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UI改善スクリーンショット</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#0f0d0a; color:#eee7db; font:14px/1.6 system-ui,sans-serif; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.sub { color:#a89f90; margin:0 0 24px; font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:24px; align-items:start; }
  figure { margin:0; background:#1b1814; border:1px solid #494033; border-radius:8px; padding:12px; }
  figcaption { font-weight:600; margin-bottom:8px; }
  img { display:block; max-width:100%; height:auto; border-radius:4px; background:#211d18; }
  .note { color:#8b8274; font-size:12px; margin:8px 0 0; }
  a { color:#d9b44a; }
</style>
</head>
<body>
<h1>リザルト編集UI 改善スクリーンショット</h1>
<p class="sub">本番コミット 14473d88 時点 / PC 1280px と スマホ 320px</p>
<div class="grid">
  <figure>
    <figcaption>PC版（1280px）</figcaption>
    <img src="ui-pc.png" alt="PC版リザルト編集UI">
    <p class="note">保存・取消・削除 44×44 / 削除は編集フォーム内 / 取得・報酬は1行サマリ</p>
  </figure>
  <figure>
    <figcaption>スマホ版（320px）</figcaption>
    <img src="ui-mobile.png" alt="スマホ版リザルト編集UI">
    <p class="note">長いチケット名は折り返し、はみ出し0px / ラベル縦置きでも破綻なし</p>
  </figure>
  <figure>
    <figcaption>取得・報酬の編集を展開（320px）</figcaption>
    <img src="ui-mobile-expanded.png" alt="取得報酬編集の展開状態">
    <p class="note">検索窓の重複注意枠を削除 / 「最大8件」文言も削除 / 1行サマリ</p>
  </figure>
</div>
</body>
</html>
