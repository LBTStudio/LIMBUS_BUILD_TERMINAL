<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 455" role="img" aria-labelledby="title desc">
<title id="title">保存・共有メニューの場所と使い分け</title>
<desc id="desc">画面上部の操作・保存を開く。現在の作業状態を保存、所持ライブラリを保存、保存データを読み込む、共有シートを開くなど目的別の操作を選ぶ。</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ffb45f"/></marker></defs>
<rect width="1080" height="455" rx="16" fill="#101010" stroke="#544a39"/><rect x="1" y="1" width="1078" height="48" rx="15" fill="#191816"/><text x="22" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#e8d7ac">◈ LIMBUS BUILD TERMINAL</text>
<rect x="760" y="9" width="286" height="32" rx="5" fill="#28251f" stroke="#ffb45f" stroke-width="2.5"/><text x="784" y="30" font-family="sans-serif" font-size="15" font-weight="800" fill="#ffe2a0">操作・保存</text><circle cx="1038" cy="10" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="1038" y="15" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">1</text>
<path d="M899 43 L899 71" fill="none" stroke="#ffb45f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="604" y="74" width="442" height="300" rx="7" fill="#1d1b18" stroke="#8c6e39" stroke-width="2"/>
<text x="626" y="101" font-family="sans-serif" font-size="16" font-weight="700" fill="#e9d4a4">操作・保存メニュー</text>
<rect x="620" y="115" width="410" height="46" rx="4" fill="#29251f" stroke="#514638"/><text x="638" y="143" font-family="sans-serif" font-size="14" fill="#ddd1bc">現在の作業状態を保存</text><text x="1000" y="143" text-anchor="end" font-family="sans-serif" font-size="11" fill="#a89e8e">JSON</text>
<rect x="620" y="167" width="410" height="46" rx="4" fill="#29251f" stroke="#514638"/><text x="638" y="195" font-family="sans-serif" font-size="14" fill="#ddd1bc">所持ライブラリを保存</text><text x="1000" y="195" text-anchor="end" font-family="sans-serif" font-size="11" fill="#a89e8e">JSON</text>
<rect x="620" y="219" width="410" height="46" rx="4" fill="#29251f" stroke="#514638"/><text x="638" y="247" font-family="sans-serif" font-size="14" fill="#ddd1bc">保存データを読み込む</text><text x="1000" y="247" text-anchor="end" font-family="sans-serif" font-size="11" fill="#a89e8e">復元</text>
<rect x="620" y="271" width="410" height="46" rx="4" fill="#51391f" stroke="#ffb45f" stroke-width="2.2"/><text x="638" y="299" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffe2a0">共有シートを開く</text><text x="1000" y="299" text-anchor="end" font-family="sans-serif" font-size="11" fill="#ffcf7c">HTML</text><circle cx="1016" cy="271" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="1016" y="276" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">2</text>
<rect x="620" y="323" width="410" height="36" rx="4" fill="#29251f" stroke="#514638"/><text x="638" y="346" font-family="sans-serif" font-size="13" fill="#ddd1bc">CCFOLIA JSONをコピー</text>
<rect x="24" y="78" width="530" height="285" rx="7" fill="#191816" stroke="#39332a"/><text x="46" y="107" font-family="sans-serif" font-size="18" font-weight="700" fill="#eee5d5">どの操作を選ぶ？</text><text x="46" y="145" font-family="sans-serif" font-size="14" fill="#d8cdbb">● 別端末へのバックアップ</text><text x="65" y="167" font-family="sans-serif" font-size="12" fill="#a99e8d">現在の作業状態を保存 / 所持ライブラリを保存</text><text x="46" y="205" font-family="sans-serif" font-size="14" fill="#d8cdbb">● 人に見せる共有ページ</text><text x="65" y="227" font-family="sans-serif" font-size="12" fill="#a99e8d">共有シートを開く</text><text x="46" y="265" font-family="sans-serif" font-size="14" fill="#d8cdbb">● セッション用データの出力</text><text x="65" y="287" font-family="sans-serif" font-size="12" fill="#a99e8d">CCFOLIA JSONをコピー</text><path d="M555 218 C575 218 590 218 611 218" fill="none" stroke="#ffb45f" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="24" y="405" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffcc7a">① 上部の「操作・保存」→ ② 目的に合う項目を選択</text><text x="24" y="430" font-family="sans-serif" font-size="12" fill="#8f887a">位置案内図。共有シートはバックアップの代用ではありません。</text>
</svg>