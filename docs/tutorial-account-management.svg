<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">SINNER SELECTとアカウント管理の操作経路</title>
<desc id="desc">アカウント管理を開き、対象キャラクターの編集、共有URL取り込み、確認と確定の順に進む。</desc>
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#d7b76b"/></marker></defs>
<rect width="1200" height="600" rx="22" fill="#11100f"/>
<text x="48" y="52" font-family="Noto Sans JP, Yu Gothic, sans-serif" font-size="28" font-weight="700" fill="#e5c879">アカウント管理から共有URLを取り込む</text>
<g font-family="Noto Sans JP, Yu Gothic, sans-serif">
<g><rect x="44" y="98" width="250" height="230" rx="14" fill="#242016" stroke="#d7b76b" stroke-width="2"/><text x="66" y="136" font-size="18" fill="#e5c879" font-weight="700">STEP 1</text><text x="66" y="176" font-size="23" fill="#f6f0e6" font-weight="700">管理を開く</text><text x="66" y="216" font-size="18" fill="#d8cfc0">起動時のSINNER SELECT</text><text x="66" y="248" font-size="18" fill="#d8cfc0">上部アカウント表示</text><text x="66" y="280" font-size="18" fill="#d8cfc0">または設定の管理ボタン</text></g>
<path d="M300 213 H326" stroke="#d7b76b" stroke-width="3" marker-end="url(#arr)"/>
<g><rect x="334" y="98" width="250" height="230" rx="14" fill="#1b1916" stroke="#67583d" stroke-width="2"/><text x="356" y="136" font-size="18" fill="#e5c879" font-weight="700">STEP 2</text><text x="356" y="176" font-size="23" fill="#f6f0e6" font-weight="700">対象を編集</text><text x="356" y="216" font-size="18" fill="#d8cfc0">カードの名前を確認</text><text x="356" y="248" font-size="18" fill="#d8cfc0">「編集」を押す</text><text x="356" y="280" font-size="18" fill="#d8cfc0">必要なら名前・用途も変更</text></g>
<path d="M590 213 H616" stroke="#d7b76b" stroke-width="3" marker-end="url(#arr)"/>
<g><rect x="624" y="98" width="250" height="230" rx="14" fill="#1b1916" stroke="#67583d" stroke-width="2"/><text x="646" y="136" font-size="18" fill="#e5c879" font-weight="700">STEP 3</text><text x="646" y="176" font-size="23" fill="#f6f0e6" font-weight="700">URLを読み込む</text><text x="646" y="216" font-size="18" fill="#d8cfc0">「硝子窓の共有データ」</text><text x="646" y="248" font-size="18" fill="#d8cfc0">「共有URLから取り込む」</text><text x="646" y="280" font-size="18" fill="#d8cfc0">URLを貼り付けて読み込む</text></g>
<path d="M880 213 H906" stroke="#d7b76b" stroke-width="3" marker-end="url(#arr)"/>
<g><rect x="914" y="98" width="242" height="230" rx="14" fill="#242016" stroke="#d7b76b" stroke-width="2"/><text x="936" y="136" font-size="18" fill="#e5c879" font-weight="700">STEP 4</text><text x="936" y="176" font-size="23" fill="#f6f0e6" font-weight="700">確認して確定</text><text x="936" y="216" font-size="18" fill="#d8cfc0">項目数・候補を確認</text><text x="936" y="248" font-size="18" fill="#d8cfc0">反映したいものを選ぶ</text><text x="936" y="280" font-size="18" fill="#d8cfc0">確定して結果を確認</text></g>
<rect x="44" y="376" width="1112" height="148" rx="14" fill="#1b1916" stroke="#67583d"/><text x="70" y="418" font-size="21" font-weight="700" fill="#e5c879">アカウントを扱うときの注意</text><text x="70" y="455" font-size="18" fill="#e1d8cb">・各アカウントは別々の保存領域です。URLを読む前に、正しいキャラクターを編集しているか確認。</text><text x="70" y="485" font-size="18" fill="#e1d8cb">・「削除」はそのアカウントの保存領域を復元できなくします。迷ったら削除せず、まず名前や用途を編集します。</text><text x="48" y="565" font-size="17" fill="#bfb5a5">人格1件だけのURLは人格タブの「テキスト流し込み反映」→「硝子窓URLから移行」へ。</text>
</g></svg>