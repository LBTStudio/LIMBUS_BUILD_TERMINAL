<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 515" role="img" aria-labelledby="title desc">
<title id="title">アカウント編集画面で共有URLから取り込む場所</title>
<desc id="desc">SINNER SELECTまたはアカウント管理を開き、対象キャラクターの編集を押し、硝子窓の共有データ内で共有URLから取り込むを選ぶ。</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ffb45f"/></marker></defs>
<rect width="1080" height="515" rx="16" fill="#101010" stroke="#544a39"/><rect x="1" y="1" width="1078" height="48" rx="15" fill="#191816"/><text x="22" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#e8d7ac">◈ LIMBUS BUILD TERMINAL</text><text x="875" y="30" font-family="sans-serif" font-size="14" fill="#d0c5b1">SINNER SELECT</text>
<rect x="18" y="67" width="478" height="393" rx="8" fill="#191816" stroke="#39332a"/><text x="38" y="95" font-family="sans-serif" font-size="11" letter-spacing="1.4" fill="#918775">CHARACTER ACCOUNTS</text><text x="38" y="122" font-family="sans-serif" font-size="20" font-weight="700" fill="#eee5d5">キャラクターを選ぶ・管理する</text>
<rect x="35" y="143" width="444" height="104" rx="6" fill="#211f1a" stroke="#6e5a36"/><circle cx="64" cy="173" r="18" fill="#3b3021" stroke="#ad8b48"/><text x="64" y="179" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#f3d28b">黒</text><text x="92" y="173" font-family="sans-serif" font-size="16" font-weight="700" fill="#e8dfce">黒雲会組員（例）</text><text x="92" y="196" font-family="sans-serif" font-size="12" fill="#a79c8a">取り込み先の名前を確認</text><rect x="380" y="157" width="78" height="33" rx="5" fill="#43341d" stroke="#ffb45f" stroke-width="2.5"/><text x="399" y="179" font-family="sans-serif" font-size="14" font-weight="700" fill="#ffe2a0">編集</text><circle cx="462" cy="153" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="462" y="158" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">1</text>
<rect x="35" y="260" width="444" height="78" rx="6" fill="#211f1a" stroke="#39332a"/><text x="53" y="284" font-family="sans-serif" font-size="14" fill="#c5bba9">別のキャラクター（例）</text><text x="53" y="307" font-family="sans-serif" font-size="12" fill="#8f887a">対象を取り違えないよう名前を先に確認</text>
<text x="38" y="377" font-family="sans-serif" font-size="13" fill="#c1b6a3">入口：起動時の SINNER SELECT</text><text x="38" y="398" font-family="sans-serif" font-size="13" fill="#c1b6a3">または上部アカウント表示／設定の管理</text>
<path d="M479 174 C520 174 522 171 553 171" fill="none" stroke="#ffb45f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="556" y="67" width="506" height="393" rx="8" fill="#191816" stroke="#39332a"/><text x="577" y="95" font-family="sans-serif" font-size="11" letter-spacing="1.4" fill="#918775">EDIT ACCOUNT</text><text x="577" y="122" font-family="sans-serif" font-size="20" font-weight="700" fill="#eee5d5">アカウントを編集</text>
<rect x="575" y="143" width="468" height="66" rx="5" fill="#211f1a" stroke="#39332a"/><text x="592" y="167" font-family="sans-serif" font-size="14" fill="#e7dcc9">アカウント名</text><rect x="592" y="176" width="431" height="23" rx="3" fill="#101010" stroke="#494237"/><text x="603" y="192" font-family="sans-serif" font-size="12" fill="#a89c88">取り込み先のキャラクター名</text>
<rect x="575" y="224" width="468" height="144" rx="6" fill="#211f1a" stroke="#9b7942" stroke-width="1.8"/><text x="592" y="249" font-family="sans-serif" font-size="15" font-weight="700" fill="#e9d4a4">硝子窓の共有データ</text><text x="592" y="270" font-family="sans-serif" font-size="12" fill="#b3a896">共有URLから所持品や購入履歴などを読み込みます。</text><rect x="592" y="289" width="278" height="43" rx="5" fill="#51391f" stroke="#ffb45f" stroke-width="2.5"/><text x="607" y="316" font-family="sans-serif" font-size="15" font-weight="800" fill="#ffe2a0">共有URLから取り込む</text><circle cx="877" cy="289" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="877" y="294" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">2</text>
<text x="592" y="351" font-family="sans-serif" font-size="11" fill="#958a79">URLを読み込んだ後、対象項目・件数を確認してから反映</text>
<text x="22" y="487" font-family="sans-serif" font-size="17" font-weight="700" fill="#ffcc7a">① 対象キャラクターの「編集」→ ②「硝子窓の共有データ」→「共有URLから取り込む」</text>
</svg>