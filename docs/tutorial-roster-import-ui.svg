<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
<title id="title">所持人格リストをまとめて取り込む場所</title>
<desc id="desc">記録を開き、リザルトを記録カードの取り込むから、所持人格リストを取り込むを選ぶ。</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#ffb45f"/></marker></defs>
<rect width="1080" height="500" rx="16" fill="#101010" stroke="#544a39"/><rect x="1" y="1" width="1078" height="48" rx="15" fill="#191816"/><text x="22" y="30" font-family="sans-serif" font-size="18" font-weight="700" fill="#e8d7ac">◈ LIMBUS BUILD TERMINAL</text>
<rect x="16" y="64" width="122" height="340" rx="8" fill="#191816" stroke="#39332a"/><text x="29" y="88" font-family="sans-serif" font-size="11" letter-spacing="1.5" fill="#8f887a">MAIN MENU</text>
<g font-family="sans-serif" font-size="15" fill="#cfc7b8"><rect x="23" y="99" width="108" height="35" rx="5" fill="#211f1a"/><text x="41" y="121">駒整形</text><rect x="23" y="140" width="108" height="35" rx="5" fill="#211f1a"/><text x="41" y="162">ビルド</text><rect x="23" y="181" width="108" height="35" rx="5" fill="#211f1a"/><text x="41" y="203">ショップ</text><rect x="23" y="222" width="108" height="39" rx="5" fill="#43341d" stroke="#e4bd68" stroke-width="1.5"/><text x="41" y="246" fill="#ffe4a4" font-weight="700">記録</text><rect x="23" y="267" width="108" height="35" rx="5" fill="#211f1a"/><text x="41" y="289">設定</text></g>
<circle cx="127" cy="241" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="127" y="246" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">1</text>
<rect x="151" y="64" width="913" height="340" rx="8" fill="#151513" stroke="#39332a"/><text x="174" y="90" font-family="sans-serif" font-size="11" letter-spacing="1.4" fill="#918775">CHARACTER RECORD</text><text x="174" y="116" font-family="sans-serif" font-size="20" font-weight="700" fill="#eee5d5">記録</text>
<rect x="170" y="131" width="875" height="36" rx="5" fill="#201f1c"/><rect x="180" y="137" width="143" height="24" rx="4" fill="#43341d" stroke="#e4bd68"/><text x="196" y="154" font-family="sans-serif" font-size="13" fill="#ffe4a4" font-weight="700">リザルト／収支</text><text x="343" y="154" font-family="sans-serif" font-size="13" fill="#bdb5a6">所持ライブラリ</text>
<rect x="170" y="180" width="875" height="202" rx="7" fill="#1b1916" stroke="#544a39"/><text x="190" y="207" font-family="sans-serif" font-size="17" font-weight="700" fill="#efe5d4">リザルトを記録</text><text x="190" y="230" font-family="sans-serif" font-size="12" fill="#a69d8e">リザルト・文章・所持リストの取り込み</text>
<rect x="856" y="188" width="164" height="36" rx="5" fill="#29251e" stroke="#ffb45f" stroke-width="2.5"/><text x="895" y="211" font-family="sans-serif" font-size="15" font-weight="800" fill="#ffe2a0">取り込む</text>
<circle cx="1009" cy="184" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="1009" y="189" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">2</text>
<path d="M946 225 L946 246" fill="none" stroke="#ffb45f" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="719" y="249" width="301" height="118" rx="6" fill="#24211c" stroke="#b18e4b" stroke-width="1.8"/><rect x="729" y="258" width="281" height="28" rx="4" fill="#201e1a"/><text x="743" y="277" font-family="sans-serif" font-size="13" fill="#cbc1af">硝子窓から一括取り込む</text>
<rect x="729" y="291" width="281" height="28" rx="4" fill="#201e1a"/><text x="743" y="310" font-family="sans-serif" font-size="13" fill="#cbc1af">テキスト流し込み</text>
<rect x="729" y="324" width="281" height="31" rx="4" fill="#51391f" stroke="#ffb45f" stroke-width="2.4"/><text x="743" y="345" font-family="sans-serif" font-size="14" font-weight="800" fill="#ffe2a0">所持人格リストを取り込む</text>
<circle cx="1007" cy="339" r="14" fill="#ffb45f" stroke="#101010" stroke-width="2"/><text x="1007" y="344" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="800" fill="#21170b">3</text>
<text x="22" y="441" font-family="sans-serif" font-size="18" font-weight="700" fill="#ffcc7a">① 記録 → ②「取り込む」→ ③「所持人格リストを取り込む」</text>
<text x="22" y="469" font-family="sans-serif" font-size="12" fill="#8f887a">画面構成を現行UIのボタン名に合わせて再構成した位置案内図（キャプチャ画像ではありません）。</text>
</svg>