<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LBT モバイルUI確認</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      gap: 16px;
      padding: 24px;
      background: #0d0b09;
      color: #e9dec7;
      font-family: system-ui, sans-serif;
    }
    .notice { width: min(100%, 640px); text-align: center; font-size: 13px; line-height: 1.65; color: #b9aa91; }
    .notice strong { color: #e2bd70; }
    .device {
      width: 390px;
      max-width: 100%;
      height: min(812px, calc(100vh - 100px));
      overflow: hidden;
      border: 10px solid #2b251f;
      border-radius: 28px;
      background: #000;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .55), inset 0 0 0 1px #765d32;
    }
    iframe { display: block; width: 390px; height: 812px; border: 0; transform-origin: top left; }
    @media (max-width: 430px) {
      body { display: block; width: 100vw; min-height: 100dvh; height: 100dvh; padding: 0; overflow: hidden; }
      .notice { display: none; }
      .device { width: 100vw; max-width: none; height: 100dvh; border: 0; border-radius: 0; box-shadow: none; }
      iframe { width: 100%; height: 100%; }
    }
  </style>
</head>
<body>
  <div class="notice"><strong>LIMBUS BUILD TERMINAL — モバイルUI確認</strong><br>PCからでも、枠内を390px幅のスマートフォン表示として操作できます。</div>
  <div class="device" aria-label="390px幅のモバイル表示">
		    <iframe src="./?mobile-preview=v64r112" title="LIMBUS BUILD TERMINAL モバイルUI"></iframe>
  </div>
</body>
</html>
