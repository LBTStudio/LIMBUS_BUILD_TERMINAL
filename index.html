<body style="background-color:#14110d">
  <div id="root"></div>
  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <script>
    function loadDB(){
      return new Promise(function(resolve, reject){
        if(window.fetch){
          fetch("data/db.json").then(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })
            .then(function(j){ window.DB = j; resolve(); }).catch(reject);
          return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "data/db.json", true);
        xhr.onload = function(){ if(xhr.status===200 || xhr.status===0){ try{ window.DB = JSON.parse(xhr.responseText); resolve(); }catch(e){ reject(e); } } else reject(new Error("http "+xhr.status)); };
        xhr.onerror = function(){ reject(new Error("xhr error")); };
        xhr.send();
      });
    }

      function lbtBoot(){
        if(!window.DB){ document.getElementById("root").innerHTML = "<div style=\"color:#c8a84b;padding:40px;text-align:center;font-family:sans-serif\">DBの読み込みに失敗しました。</div>"; return; }
        if(!window.App){ document.getElementById("root").innerHTML = "<div style=\"color:#c8a84b;padding:40px;text-align:center;font-family:sans-serif\">アプリの読み込みに失敗しました。ページを再読み込みしてください。</div>"; return; }
        window.LBT_VERSION = "v54";
        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
      }
        loadDB().then(lbtBoot).catch(function(){
      document.getElementById("root").innerHTML = "<div style=\"color:#c8a84b;padding:40px;text-align:center;font-family:sans-serif\">DBの読み込みに失敗しました。file:// で直接開いている場合はローカルサーバー経由で開いてください（README参照）。</div>";
    });
  </script>
