<script>
/* DB 取得は後段の本体 <script> に依存しないので、ここで先に開始して読込を重ねる。
   stylesheet より後ろに置くと CSS 待ちで開始が遅れるため、head の先頭側に置く。
   db.json は起動の律速なので priority:"high"。40 本超のアセット読込と
   帯域を奪い合っても後回しにされない。 */
function validateItemCatalog(items, specialItems) {
  if (!Array.isArray(items)) throw new Error("アイテム一覧が配列として読み込めません");
  const requiredItems = [
    ["enh-oxygen-cylinder", "酸素ボンベ"],
    ["enh-villebe-cigarette", "ヴィリーブ工房の煙草"]
  ];
  const missingItems = requiredItems.filter(([id]) => !items.some((item) => item && item.id === id)).map(([, name]) => name);
  if (missingItems.length) throw new Error("アイテム一覧に必須アイテムがありません: " + missingItems.join("、"));
  if (items.length < 35) throw new Error("アイテム一覧が不完全です（通常アイテム35種以上が必要です）");
  const itemIds = items.map((item) => String(item && item.id || ""));
  if (itemIds.some((id) => !id) || new Set(itemIds).size !== itemIds.length) throw new Error("アイテム一覧にIDの欠落または重複があります");

  if (!Array.isArray(specialItems)) throw new Error("特殊アイテム一覧が配列として読み込めません");
  const requiredSpecialItems = [
    ["resource-ego-shard", "自我の欠片"],
    ["resource-glass-shard", "硝子の破片"]
  ];
  const missingSpecialItems = requiredSpecialItems.filter(([id]) => !specialItems.some((item) => item && item.id === id)).map(([, name]) => name);
  if (missingSpecialItems.length) throw new Error("特殊アイテム一覧に必須項目がありません: " + missingSpecialItems.join("、"));
  const specialIds = specialItems.map((item) => String(item && item.id || ""));
  if (specialIds.some((id) => !id) || new Set(specialIds).size !== specialIds.length) throw new Error("特殊アイテム一覧にIDの欠落または重複があります");
}

function loadDB(){
  return new Promise(function(resolve, reject){
    if(window.fetch){
      function readJSON(url, options){
        return fetch(url, options).then(function(r){
          if(!r.ok) throw new Error("http "+r.status+" for "+url);
          return r.json();
        });
      }
      readJSON("data/db.json?v=16b6df9e", {priority:"high"}).then(function(db){
        return Promise.allSettled([
          readJSON("data/items.json?v=b185394a"),
          readJSON("data/gacha-theme-packs.json?v=8d4dced2"),
          readJSON("data/special-items.json?v=aaa21cfb")
        ]).then(function(aux){
          if(aux[0].status !== "fulfilled") throw new Error("必須アイテム一覧を読み込めません: data/items.json");
          if(aux[2].status !== "fulfilled") throw new Error("必須特殊アイテム一覧を読み込めません: data/special-items.json");
          const items = aux[0].value;
          const specialItems = aux[2].value;
          validateItemCatalog(items, specialItems);
          window.DB = db;
          window.DB.items = items;
          window.DB.specialItems = specialItems;
          window.LBT_GACHA_PACKS = aux[1].status === "fulfilled" && aux[1].value && typeof aux[1].value === "object" ? aux[1].value : { packs: [] };
          if(aux[1].status === "rejected" && window.console && console.warn) console.warn("gacha-theme-packs.json を読み込めません。既定のパック一覧で起動します。", aux[1].reason);
          resolve();
        });
      }).catch(reject);
      return;
    }

    function readXHR(url, optional){
      return new Promise(function(resolveJSON, rejectJSON){
        const xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.onload = function(){
          if(xhr.status === 200 || xhr.status === 0){
            try { resolveJSON(JSON.parse(xhr.responseText)); }
            catch(error) { rejectJSON(error); }
          } else if(optional) {
            if(window.console && console.warn) console.warn(url + " を読み込めません。既定値を使います。", xhr.status);
            resolveJSON({ packs: [] });
          } else rejectJSON(new Error("http " + xhr.status + " for " + url));
        };
        xhr.onerror = function(){
          if(optional) resolveJSON({ packs: [] });
          else rejectJSON(new Error("xhr error for " + url));
        };
        xhr.send();
      });
    }
    Promise.all([
      readXHR("data/db.json?v=16b6df9e"),
      readXHR("data/items.json?v=b185394a"),
      readXHR("data/gacha-theme-packs.json?v=8d4dced2", true),
      readXHR("data/special-items.json?v=aaa21cfb")
    ]).then(function(values){
      validateItemCatalog(values[1], values[3]);
      window.DB = values[0];
      window.DB.items = values[1];
      window.DB.specialItems = values[3];
      window.LBT_GACHA_PACKS = values[2] && typeof values[2] === "object" ? values[2] : { packs: [] };
      resolve();
    }).catch(reject);
  });
}

function lbtBoot(){
  if(!window.DB){ document.getElementById("root").innerHTML = "<div style=\"color:#c8a84b;padding:40px;text-align:center;font-family:sans-serif\">DBの読み込みに失敗しました。</div>"; return; }
  if(!window.App){ document.getElementById("root").innerHTML = "<div style=\"color:#c8a84b;padding:40px;text-align:center;font-family:sans-serif\">アプリの読み込みに失敗しました。ページを再読み込みしてください。</div>"; return; }
  /* キーワード監査は DB の取得完了と本体スクリプトの読込完了を両方待つ必要があるため、起動時に走らせる。 */
  window.LBT_PERSONA_KEYWORD_AUDIT = window.LBT_enrichPersonaKeywords ? window.LBT_enrichPersonaKeywords(window.DB) : null;
  window.LBT_EGO_KEYWORD_AUDIT = window.LBT_enrichEgoKeywords ? window.LBT_enrichEgoKeywords(window.DB) : null;
  window.LBT_VERSION = "V65r68";
  window.LBT_OGP_GATEWAY_ORIGIN = "https://lbt-ogp.lbtstudio-share.workers.dev";
  const _AppTree = window.LBTErrorBoundary ? React.createElement(LBTErrorBoundary, null, React.createElement(App)) : React.createElement(App);
  ReactDOM.createRoot(document.getElementById("root")).render(_AppTree);
}

var lbtDbReady = loadDB();
</script>

/* Google Fonts は load イベント後に読み始める。クリティカルパスから外すことで、
   外部フォントへの到達性（遮断地域・オフライン・遅い DNS）が本文の描画を妨げない。
   display=swap のため本文は先にシステムフォントで出る（以前の media=print 方式と同挙動）。 */

  document.head.appendChild(l);
});
</script>

<script>
/* Service Worker: 再訪時は ?v= 付きアセットをキャッシュから即座に返す（オフライン起動も可）。
   ?v= は内容ハッシュなので cache-first が安全（sw.js のリストは sync ツールが生成）。
   登録は load 後。初回のクリティカルパスと帯域を precache に奪わせない。
   reg.update() がデプロイ後の SW 更新チェックを起動する（既定は 24 時間待ち）。 */
(function(){
  if(!("serviceWorker" in navigator)) return;
  if(location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){ reg.update(); }).catch(function(){});
  });
})();
</script>
