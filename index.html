/* CSS カスケード層の宣言。
   検証済み: @layer a, b; では b 側が勝つ（後ろに宣言するほど強い）。
   したがって「あとから読まれるファイルほど強い」という CSS の従来仕様を再現する
   には、<link> 順のまま並べる（後に読むファイルほど強い）。

   この並びで同特異度の宣言の勝敗は導入前と完全に一致する。
   ただし優先関係がファイル名ではなくここで一度宣言した内容で決まるため、
   ファイルを増やしたり並べ替えたりしても勝敗は変わらない。

   !important は design-system の prefers-reduced-motion 抑制のみ残る。
   層の外側に置くことで他のどの層より強く動作する。 */
@layer design-system,
        workspace,
        persona-codex,
        sections,
        v52-overlay,
        v53-overlay,

        v65r29-draft-import,

</style>

  <script>
    function loadDB(){
      return new Promise(function(resolve, reject){
	        if(window.fetch){
		          Promise.all([fetch("data/db.json?v=a6b1f41a"), fetch("data/items.json?v=b47b58ae")]).then(function(rs){ return Promise.all(rs.map(function(r){ if(!r.ok) throw new Error("http "+r.status); return r.json(); })); })
	          .then(function(rows){ window.DB = rows[0]; window.DB.items = Array.isArray(rows[1]) ? rows[1] : []; window.LBT_PERSONA_KEYWORD_AUDIT = window.LBT_enrichPersonaKeywords ? window.LBT_enrichPersonaKeywords(window.DB) : null; window.LBT_EGO_KEYWORD_AUDIT = window.LBT_enrichEgoKeywords ? window.LBT_enrichEgoKeywords(window.DB) : null; resolve(); }).catch(reject);
          return;
        }
        var xhr = new XMLHttpRequest();
		        xhr.open("GET", "data/db.json?v=a6b1f41a", true);
	        xhr.onload = function(){ if(xhr.status===200 || xhr.status===0){ try{ window.DB = JSON.parse(xhr.responseText); window.DB.items = []; window.LBT_PERSONA_KEYWORD_AUDIT = window.LBT_enrichPersonaKeywords ? window.LBT_enrichPersonaKeywords(window.DB) : null; window.LBT_EGO_KEYWORD_AUDIT = window.LBT_enrichEgoKeywords ? window.LBT_enrichEgoKeywords(window.DB) : null; resolve(); }catch(e){ reject(e); } } else reject(new Error("http "+xhr.status)); };
        xhr.onerror = function(){ reject(new Error("xhr error")); };
        xhr.send();
      });
    }

      function lbtBoot(){
        if(!window.DB){ document.getElementById("root").innerHTML = "<div style=\"color:#c8a84b;padding:40px;text-align:center;font-family:sans-serif\">DBの読み込みに失敗しました。</div>"; return; }
        if(!window.App){ document.getElementById("root").innerHTML = "<div style=\"color:#c8a84b;padding:40px;text-align:center;font-family:sans-serif\">アプリの読み込みに失敗しました。ページを再読み込みしてください。</div>"; return; }
	    window.LBT_VERSION = "V65r68";
		        window.LBT_OGP_GATEWAY_ORIGIN = "https://lbt-ogp.lbtstudio-share.workers.dev";
        const _AppTree = window.LBTErrorBoundary ? React.createElement(LBTErrorBoundary, null, React.createElement(App)) : React.createElement(App);
        ReactDOM.createRoot(document.getElementById("root")).render(_AppTree);
      }
  </script>
