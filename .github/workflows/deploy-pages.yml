name: Deploy production site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - name: Verify asset versions
        run: node tools/sync-asset-versions.mjs --check
      - name: Verify B-type production entry
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const sw = readFileSync('sw.js', 'utf8');
          const required = [
            'id="b-type-production-rollout"',
            'settings-order-embedded',
            'assets/workspace.css?v=',
            'js/App.js?v='
          ];
          for (const marker of required) {
            if (!html.includes(marker)) throw new Error('Production entry is missing: ' + marker);
          }
          const appRef = html.match(/js\/App\.js\?v=([a-f0-9]+)/)?.[0];
          if (!appRef || !sw.includes(appRef)) throw new Error('Service Worker does not precache the current App.js asset.');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Archive static site for Pages
        run: |
          tar --dereference --hard-dereference --directory . -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload Pages artifact (fully pinned)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Set up Node.js 24 for post-deploy smoke test
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "24"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
      - name: Verify the deployed production page and every precached asset
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/ui/verify-production-pages.mjs "$PAGE_URL"
