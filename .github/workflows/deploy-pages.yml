name: Deploy production site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify asset versions
        run: node tools/sync-asset-versions.mjs --check
      - name: Verify B-type production entry
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('index.html', 'utf8');
          const sw = readFileSync('sw.js', 'utf8');
          const required = [
            'id="b-type-production-rollout"',
            'settings-order-embedded',
            'assets/workspace.css?v=',
            'js/App.js?v='
          ];
          for (const marker of required) {
            if (!html.includes(marker)) throw new Error('Production entry is missing: ' + marker);
          }
          const appRef = html.match(/js\/App\.js\?v=([a-f0-9]+)/)?.[0];
          if (!appRef || !sw.includes(appRef)) throw new Error('Service Worker does not precache the current App.js asset.');
          NODE
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Archive static site for Pages
        run: |
          tar --dereference --hard-dereference --directory . -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
      - name: Upload Pages artifact (fully pinned)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
