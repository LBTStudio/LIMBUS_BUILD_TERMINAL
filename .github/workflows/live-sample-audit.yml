name: live-garasumado-sample-audit

on:
  pull_request:
    paths:
      - ".github/workflows/live-sample-audit.yml"
      - "tools/audit-garasumado-live-samples.mjs"
      - "tools/rule-based-opening-audit.mjs"
      - "tests/rule-based-opening-audit.test.mjs"
      - "js/garasumado-memo-parse.js"
      - "tests/garasumado-import.test.mjs"
      - "tests/fixtures/garasumado-share-url-baseline.json"
      - "tests/garasumado-share-baseline.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-live-shares:
    name: Audit shared sample corpus (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Run live parser audit over the 98 known shared URLs
        run: node tools/audit-garasumado-live-samples.mjs
