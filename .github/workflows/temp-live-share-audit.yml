name: temporary live share audit (read-only)

on:
  push:
    branches:
      - audit/final-live-share-audit-20261027

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit supplied public Garasumado share URLs (read-only)
        run: node tools/audit-live-garasumado.mjs
