name: verify

# 2026-10-21: f8611d7 が構文エラー入りの js/persona-draft-import.js を main へ
# 直接 push し、硝子窓URL取り込みが本番で起動不能になった。検査自体は
# tests/browser-load-gate.test.mjs に存在していたが、push 前に走らせる層が
# 無かったため素通りした。ここがその層。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "24"
      - name: Set up Python for PDF provenance tests
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: "3.12"
      - name: Install pinned PDF extraction dependency
        run: python -m pip install --disable-pip-version-check -r tools/provenance/requirements.txt
      - name: Verify asset version hashes and Service Worker precache
        run: node tools/sync-asset-versions.mjs --check
      - name: Verify deployed Pages smoke-test syntax
        run: node --check tools/ui/verify-production-pages.mjs
      - name: Verify live account recovery smoke-test syntax
        run: node --check tools/ui/verify-account-recovery-live.mjs
      - name: Verify short-link publish and restore round-trip
        run: node tools/ui/verify-short-works.mjs
      - name: Verify emitted short-link size and preview markers
        run: node tools/ui/verify-short-url.mjs
      - name: Smoke-test deployed account recovery (main only, read-only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node tools/ui/verify-account-recovery-live.mjs
      - name: Run the complete project test command
        run: node --test "tests/*.test.mjs"
