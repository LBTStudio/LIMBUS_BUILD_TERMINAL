name: Tutorial UI screenshot capture

on:
  push:
    branches: [main]
    paths:
      - "js/App.js"
      - "js/OtherSections.js"
      - "js/PersonaCodex.js"
      - "js/accounts-ui.js"
      - "assets/**"
      - "index.html"
      - "tools/ui/capture-tutorial-screenshots.mjs"
      - ".github/workflows/tutorial-screenshot-capture.yml"
      - "docs/tutorial-guide.md"
  pull_request:
    paths:
      - "js/App.js"
      - "js/OtherSections.js"
      - "js/PersonaCodex.js"
      - "js/accounts-ui.js"
      - "assets/**"
      - "index.html"
      - "tools/ui/capture-tutorial-screenshots.mjs"
      - ".github/workflows/tutorial-screenshot-capture.yml"
      - "docs/tutorial-guide.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Capture annotated desktop and mobile UI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: "24"

      - name: Install Playwright
        run: npm install --no-save playwright@1.64.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture real UI and annotate target controls
        run: node tools/ui/capture-tutorial-screenshots.mjs

      - name: Convert screenshots to compact WebP
        run: |
          python3 -m pip install --disable-pip-version-check pillow
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          source = Path("artifacts/tutorial-screenshots")
          target = Path("docs/tutorial-captures")
          target.mkdir(parents=True, exist_ok=True)
          pngs = sorted(source.glob("*.png"))
          for png in pngs:
              # Keep the help-index screenshots in the expiring QA Artifact only.
              # The public guide remains a focused set of 12 task screenshots.
              if png.stem.startswith("help-index-"):
                  continue
              with Image.open(png) as im:
                  im.convert("RGB").save(
                      target / (png.stem + ".webp"),
                      format="WEBP",
                      quality=86,
                      method=6,
                  )
          original = json.loads((source / "manifest.json").read_text(encoding="utf-8"))
          original["sourceFiles"] = original["files"]
          original["qaOnlyFiles"] = [name for name in original["sourceFiles"] if name.startswith("help-index-")]
          original["files"] = [p.stem + ".webp" for p in sorted(target.glob("*.webp"))]
          original["format"] = "WebP, quality 86"
          original["count"] = len(original["files"])
          (target / "manifest.json").write_text(
              json.dumps(original, ensure_ascii=False, indent=2) + "\\n",
              encoding="utf-8",
          )
          if len(original["files"]) != 18:
              raise SystemExit("Expected 18 WebP screenshots, got " + str(len(original["files"])))
          PY

      # Screenshots are delivered as a workflow artifact. CI must not push
      # generated images back into a PR branch: that creates a second PR event
      # under the bot identity and can require manual workflow approval.
      - name: Upload screenshots and manifest
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: lbt-tutorial-ui-captures-${{ github.sha }}
          path: |
            artifacts/tutorial-screenshots/
            docs/tutorial-captures/
          if-no-files-found: error
          retention-days: 30

      # Keep the guide's 18 WebP links live in same-repository PRs.
      # Fork PRs remain artifact-only and never receive write access.
      - name: Commit generated guide screenshots to the same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git fetch origin "$HEAD_REF"
          git worktree add /tmp/lbt-pr-head "origin/$HEAD_REF"
          mkdir -p /tmp/lbt-pr-head/docs/tutorial-captures
          cp docs/tutorial-captures/*.webp /tmp/lbt-pr-head/docs/tutorial-captures/
          cp docs/tutorial-captures/manifest.json /tmp/lbt-pr-head/docs/tutorial-captures/
          git -C /tmp/lbt-pr-head config user.name "github-actions[bot]"
          git -C /tmp/lbt-pr-head config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/lbt-pr-head add docs/tutorial-captures/*.webp docs/tutorial-captures/manifest.json
          if git -C /tmp/lbt-pr-head diff --cached --quiet; then
            echo "Tutorial screenshots are already up to date."
          else
            git -C /tmp/lbt-pr-head commit -m "docs: refresh actual tutorial UI screenshots"
            git -C /tmp/lbt-pr-head push origin "HEAD:$HEAD_REF"
          fi
